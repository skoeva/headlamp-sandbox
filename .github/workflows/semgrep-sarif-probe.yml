name: Semgrep SARIF sandbox probe

on:
  push:
    branches:
      - experiment/semgrep-sarif-base
  pull_request:
    branches:
      - experiment/semgrep-sarif-base

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Check out pinned public rules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: semgrep/semgrep-rules
          ref: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          path: .semgrep-rules
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Semgrep Community Edition
        run: python -m pip install semgrep==1.185.0

      - name: Scan Go, JavaScript, and TypeScript locally
        run: |
          semgrep scan \
            --config .semgrep-rules/go \
            --config .semgrep-rules/javascript \
            --config .semgrep-rules/typescript \
            --exclude .semgrep-rules \
            --metrics off \
            --disable-version-check \
            --jobs 2 \
            --timeout 5 \
            --sarif \
            --output semgrep.sarif \
            .

      - name: Summarize SARIF without source snippets
        run: |
          jq -e '.runs | length > 0' semgrep.sarif
          jq '{tools: [.runs[].tool.driver.name], rules: [.runs[].tool.driver.rules[]] | length, findings: [.runs[].results[]] | length}' semgrep.sarif

      - name: Upload non-CodeQL SARIF and wait for processing
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          sarif_file: semgrep.sarif
          category: semgrep-community-sandbox-probe
          wait-for-processing: true
