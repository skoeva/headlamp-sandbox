name: Fetch exact repeatable-build input
on:
  push:
    branches: [experiment/repeatable-build-input]
    paths: [.github/workflows/sandbox-repeatable-build-input.yml]
permissions:
  contents: read
jobs:
  fetch:
    if: github.repository == 'skoeva/headlamp-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch and verify exact locked dependency bytes
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          async function main() {
            const response = await fetch('https://registry.npmjs.org/@hono/node-server/-/node-server-2.1.8.tgz');
            if (!response.ok) throw new Error(`Canonical download failed: HTTP ${response.status}`);
            const contents = Buffer.from(await response.arrayBuffer());
            const actual = 'sha512-' + crypto.createHash('sha512').update(contents).digest('base64');
            const expected = 'sha512-jdf7FHh6A1lzjpHHQUgxsg2GeER2vMetnAOfeActzcoli6jamlK+NAwL6Dsr5Fl3BS3tYUQzCdtZjU8Qxv7bEA==';
            if (actual !== expected) throw new Error('Locked dependency integrity mismatch');
            fs.writeFileSync('node-server-2.1.8.tgz', contents);
            console.log('Verified exact app/package-lock.json integrity:', actual);
          }
          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locked-node-server
          path: node-server-2.1.8.tgz
          if-no-files-found: error
          retention-days: 1
