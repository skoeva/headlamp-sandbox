name: Sandbox desktop coverage validation

on:
  push:
    branches: [experiment/desktop-coverage-platforms]

permissions:
  contents: read

jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.*'
          cache-dependency-path: backend/go.sum
      - run: npm --prefix app ci
      - run: npm --prefix app/e2e-tests ci
      - run: npm run backend:build
      - if: runner.os == 'Linux'
        run: npm --prefix app/e2e-tests exec -- playwright install --with-deps chromium
      - name: Validate Windows coverage
        if: runner.os == 'Windows'
        run: npm run app:test:coverage -- appMenuZoom.spec.ts buildManifest.spec.ts clusterRegistration.spec.ts externalBackendToken.spec.ts listenerCleanup.spec.ts pluginManager.spec.ts
      - name: Validate Linux coverage
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run app:test:coverage -- appMenuZoom.spec.ts buildManifest.spec.ts clusterRegistration.spec.ts externalBackendToken.spec.ts listenerCleanup.spec.ts pluginManager.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-coverage-${{ runner.os }}
          path: |
            app/coverage
            app/e2e-tests/test-results
